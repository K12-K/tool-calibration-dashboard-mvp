server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # uploads: 5 files x 3 MB are sent one request at a time; 5m leaves headroom for multipart overhead
    client_max_body_size 5m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API -> backend container
    location /api/ {
        proxy_pass http://backend.railway.internal:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # runtime config must never be cached
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # hashed build assets can be cached for a long time
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # single-page app fallback
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
